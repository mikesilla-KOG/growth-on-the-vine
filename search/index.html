<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="../">

  <main class="wrap search-page">
    <p class="section-label">Search the vines</p>
    <h1>Search the vines</h1>
    <p class="search-lede">Type a topic, verse, or keyword. Results rank against title, takeaway, Scripture, tags, and keywords.</p>

    <form id="search-form" class="search-form" role="search" action="./" method="get">
      <label class="visually-hidden" for="search-input">Search clips</label>
      <div class="search-box">
        <input
          id="search-input"
          name="q"
          type="search"
          enterkeyhint="search"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          placeholder="e.g. clanging cymbal, 1 Corinthians 13, love…"
          aria-describedby="search-status"
        >
        <button type="submit" class="btn search-submit">Search</button>
      </div>
    </form>

    <p id="search-status" class="search-status idle" aria-live="polite">Loading clips…</p>
    <div id="search-results" class="search-results"></div>
  </main>
